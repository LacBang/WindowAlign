<body>
<h1>安装 WindowAlign</h1>
<p>WindowAlign 是菜单栏窗口管理器。此安装包会把应用安装到“应用程序”（/Applications）。</p>
<p>安装完成后会打开 WindowAlign。首次启动时会出现“需要辅助功能权限”窗口，请点击“打开系统设置”，并在“隐私与安全性 → 辅助功能”中打开 WindowAlign 的开关。</p>
<p>应用无网络请求，不会上传窗口内容。</p>
</body>
</html>
