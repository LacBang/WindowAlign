<body>
<h1>WindowAlign</h1>
<p>应用安装位置：/Applications/WindowAlign.app。它驻留在菜单栏，不常驻程序坞。</p>
<p>首次打开且尚未获得辅助功能权限时，点击“打开系统设置”。这一步会打开“隐私与安全性 → 辅助功能”，并把 WindowAlign 加入列表。打开开关后回到应用窗口，看到“已授权，可以开始使用”即可。</p>
<p>如果列表里已有 WindowAlign 但无法使用，请先移除再重新添加。之后也可从菜单栏的“检查辅助功能权限…”重新打开该流程。</p>
<p>WindowAlign 没有网络请求，不会上传窗口内容。</p>
</body>
</html>
